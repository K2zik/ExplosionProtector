name: ExplosionProtector
version: '${version}'
main: org.SlidrusForeal.explosionProtector.ExplosionProtector
# Lowest supported line — newer Paper/Folia (1.20–26.x) still load this single JAR.
api-version: '${apiVersion}'
softdepend:
  - CoreProtect
libraries:
  - org.xerial:sqlite-jdbc:3.49.1.0
folia-supported: ${foliaSupported}

commands:
  ep:
    description: ExplosionProtector commands (status, info, language, reload, toggle, save, cacheclear)
    usage: /ep <status|info|language|reload|toggle|save|cacheclear>
    aliases:
      - explosionprot

permissions:
  explosionprotector.info:
    description: Allows viewing plugin status/info.
    default: op
  explosionprotector.reload:
    description: Allows reloading ExplosionProtector config.
    default: op
  explosionprotector.toggle:
    description: Allows toggling explosion protection runtime state.
    default: op
